<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piper Industry Partners</title>
<meta name="description" content="Piper High School Academies industry partner directory">
<!--
  Piper Industry Partners
  This ONE file runs in two places:
    1. GitHub Pages (main)   -> your two links go in config.js (next to this file), not here
    2. Google Apps Script    -> paste this whole file into the script's "Index.html" (no edits needed)
  Updating? Just replace this file. config.js keeps your links.
  Open with ?demo at the end of the address to try it with sample data.
-->
<script>
// Fallback only. Prefer config.js; anything filled in there wins.
window.PIPER_CONFIG = {
  // "Public" Apps Script deployment URL (Who has access: Anyone). Ends in /exec
  API_URL: '',
  // "Staff" Apps Script deployment URL (Who has access: Anyone within piperschools.us). Ends in /exec
  STAFF_URL: '',
  // Optional: link to a logo image (PNG/SVG). Leave blank to use the built-in Piper "P" mark.
  LOGO_URL: ''
};
</script>
<style>
:root{
  --piper:#543484; --piper-600:#4a2d75; --piper-700:#3d2463; --piper-900:#26163f;
  --piper-50:#f6f2fb; --piper-100:#ece4f6; --piper-200:#d9caee; --piper-300:#bba3de;
  --ink:#1d1828; --ink-2:#3a3447; --muted:#6a6377; --line:#e5e0ec; --line-2:#d6cfe0;
  --bg:#f6f5f9; --card:#ffffff; --ok:#17734a; --ok-bg:#e6f4ec; --warn:#9a5800; --warn-bg:#fdf1de;
  --danger:#b42318; --danger-bg:#fdeceb; --focus:#7c4dcc;
  --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(38,22,63,.06),0 4px 16px rgba(38,22,63,.06);
  --shadow-lg:0 12px 40px rgba(38,22,63,.22);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
a{color:var(--piper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px} .nowrap{white-space:nowrap}
.grow{flex:1} .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .stack{display:grid;gap:12px}
.hide{display:none!important}

/* ---------- top bar */
.topbar{background:var(--piper);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 2px 10px rgba(38,22,63,.25)}
.topbar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}
.mark{width:36px;height:36px;border-radius:9px;background:#fff;color:var(--piper);display:grid;place-items:center;font-weight:800;font-size:21px;flex:none;letter-spacing:-1px}
.mark img{width:100%;height:100%;object-fit:contain;border-radius:9px}
.brand b{display:block;font-size:16px;line-height:1.1}
.brand div span{display:block;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:14px;opacity:.85;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav a:hover{background:rgba(255,255,255,.1);opacity:1}
.nav a[aria-current="page"]{background:rgba(255,255,255,.18);opacity:1;font-weight:600}
.badge-n{background:#fff;color:var(--piper);border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.me{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#fff;opacity:.9;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:#5ee39a;box-shadow:0 0 0 3px rgba(94,227,154,.25)}
.live.off i{background:#ffc857;box-shadow:0 0 0 3px rgba(255,200,87,.25)}
.live.flash i{animation:pulse .8s ease 2}
@keyframes pulse{50%{transform:scale(1.7)}}
@media (prefers-reduced-motion:reduce){.live.flash i{animation:none}}
.banner.warn{background:#fdeceb;color:#7a1d14;border-bottom-color:#f3c3bf}
.me-btn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:4px 6px 4px 4px;display:flex;align-items:center;gap:8px;cursor:pointer}
.me-btn:hover{background:rgba(255,255,255,.2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--piper-100);color:var(--piper-700);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.role-tag{font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.9;padding-right:6px}
.menu{position:absolute;right:20px;top:56px;background:#fff;color:var(--ink);border-radius:12px;box-shadow:var(--shadow-lg);min-width:240px;padding:6px;z-index:40}
.menu .who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu button,.menu a{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink);text-decoration:none;font-size:14px}
.menu button:hover,.menu a:hover{background:var(--piper-50)}
.banner{background:#fff4d6;color:#5c4100;text-align:center;font-size:13px;padding:7px 16px;border-bottom:1px solid #f0dfa8}
.banner button{background:none;border:0;text-decoration:underline;color:inherit;cursor:pointer;padding:0 4px}
.refreshing{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:#fff;font-size:13px;padding:7px 14px;border-radius:999px;z-index:60;box-shadow:var(--shadow-lg)}

/* ---------- layout */
main{max-width:1320px;margin:0 auto;padding:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.page-head h1{font-size:24px;margin:0;color:var(--piper-900);letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700}

/* ---------- controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--piper-300);background:var(--piper-50)}
.btn.primary{background:var(--piper);border-color:var(--piper);color:#fff}
.btn.primary:hover{background:var(--piper-600)}
.btn.danger{color:var(--danger);border-color:#f1c4c0}
.btn.danger:hover{background:var(--danger-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--piper-50)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon{width:16px;height:16px;flex:none}
.field{display:grid;gap:5px}
.field>span,.label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field small{color:var(--muted);font-size:12px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);border-radius:10px;background:#fff;padding:9px 12px;min-height:40px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{border-color:var(--piper);outline:none;box-shadow:0 0 0 3px var(--piper-100)}
.search{position:relative;flex:1;min-width:220px}
.search .input{padding-left:38px;font-size:15px;min-height:44px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.req{color:var(--danger)}
.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--piper);margin:1px 0 0;flex:none}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;text-align:left;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;user-select:none;line-height:1.3}
.chip:hover{border-color:var(--piper-300)}
.chip[aria-pressed="true"],.chip.on{background:var(--piper);border-color:var(--piper);color:#fff}
.chip .n{font-size:11px;opacity:.7}
.chip input{position:absolute;opacity:0;pointer-events:none}
label.chip:has(input:checked){background:var(--piper);border-color:var(--piper);color:#fff}
label.chip:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--piper-50);color:var(--piper-700);border:1px solid var(--piper-100);border-radius:6px;padding:1px 8px;font-size:12px;line-height:1.6;white-space:nowrap}
.tag.plain{background:#f2f1f5;color:var(--ink-2);border-color:#e6e4ec}
.acad{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.acad i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.acad.box{border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:#fff}
.status{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.status.Active{background:var(--ok-bg);color:var(--ok)}
.status.Inactive{background:#efeef2;color:var(--muted)}
.status.Do-Not-Contact{background:var(--danger-bg);color:var(--danger)}

/* ---------- directory */
.dir{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.filters{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding:16px}
.filters .group{padding:12px 0;border-top:1px solid var(--line)}
.filters .group:first-child{border-top:0;padding-top:0}
.filters h3{margin:0 0 8px;font-size:13px;color:var(--ink-2)}
.filters .chips .chip{font-size:12.5px;padding:3px 10px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-2px 0 12px}
.active-filters .chip{background:var(--piper-50);border-color:var(--piper-100);color:var(--piper-700)}
.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--piper-900);color:#fff;border-radius:12px;padding:8px 10px 8px 16px;margin-bottom:12px;position:sticky;top:68px;z-index:5}
.bulkbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.bulkbar .btn:hover{background:rgba(255,255,255,.2)}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfafd;position:sticky;top:0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#faf8fd}
.tbl tbody tr.sel td{background:var(--piper-50)}
.tbl .cb{width:40px;padding-right:0}
.tbl .cb input{width:18px;height:18px;accent-color:var(--piper);cursor:pointer}
.who-cell b{display:block;font-weight:600}
.who-cell .muted{font-size:13px}
.cell-tags{display:flex;flex-wrap:wrap;gap:4px;max-width:260px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 6px}
.more{padding:14px;text-align:center;border-top:1px solid var(--line)}
.count{font-weight:600;color:var(--ink-2)}
.stale{color:var(--warn)}
.filters-toggle{display:none}

/* ---------- drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(29,24,40,.42);z-index:50;animation:fade .15s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:51;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slide .18s ease}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.drawer-head .avatar{width:48px;height:48px;font-size:17px;background:var(--piper);color:#fff}
.drawer-head h2{margin:0;font-size:20px;line-height:1.2}
.drawer-body{padding:16px 20px 28px;overflow:auto;flex:1}
.drawer-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.drawer section{margin-top:20px}
.facts{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:0}
.facts dt{color:var(--muted);font-size:13px}
.facts dd{margin:0;word-break:break-word}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.timeline li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.timeline .date{font-weight:700;color:var(--piper-700);font-size:13px;min-width:86px}
.notes{white-space:pre-wrap;background:#fbfafd;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
.modal{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:20px;overflow:auto}
.modal .scrim{z-index:0}
.modal-card{z-index:1;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:min(720px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:pop .15s ease;position:relative}
.modal-card.narrow{width:min(480px,100%)}
.modal-head{padding:18px 22px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-head h2{margin:0;font-size:19px;color:var(--piper-900)}
.modal-body{padding:6px 22px 18px;overflow:auto}
.modal-foot{padding:12px 22px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.grid3{display:grid;grid-template-columns:100px 1fr 1fr;gap:12px 14px}
.span2{grid-column:1/-1}
.warnbox{background:var(--warn-bg);border:1px solid #f3d29a;color:#5d3a00;border-radius:10px;padding:10px 12px;font-size:14px}
.errbox{background:var(--danger-bg);border:1px solid #f3c3bf;color:var(--danger);border-radius:10px;padding:10px 12px;font-size:14px}
.okbox{background:var(--ok-bg);border:1px solid #bfe3cf;color:#0f5434;border-radius:10px;padding:10px 12px;font-size:14px}
.x{background:none;border:0;cursor:pointer;border-radius:8px;padding:6px;color:var(--muted);display:grid;place-items:center}
.x:hover{background:var(--piper-50);color:var(--ink)}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(30px);opacity:.4}} @keyframes pop{from{transform:scale(.98);opacity:.4}}

/* ---------- other pages */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:26px;color:var(--piper-900);line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:170px 1fr 36px;gap:10px;align-items:center;font-size:13px}
.bar-track{background:var(--piper-50);border-radius:6px;height:12px;overflow:hidden}
.bar-fill{background:var(--piper);height:100%;border-radius:6px}
.sub-card{padding:16px 18px;display:grid;gap:12px}
.sub-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.match{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--piper);border-bottom-color:var(--piper)}
.set-table{width:100%;border-collapse:collapse}
.set-table td{padding:4px 4px;vertical-align:top}
.set-table .input{min-height:36px;padding:7px 10px}
.qr{background:#fff;padding:14px;border-radius:12px;border:1px solid var(--line);width:220px;height:220px;display:grid;place-items:center}
.qr svg{width:100%;height:100%}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--piper-50);border:1px solid var(--piper-100);border-radius:10px;padding:8px 8px 8px 12px;word-break:break-all;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;z-index:80;box-shadow:var(--shadow-lg);font-size:14px;max-width:min(560px,calc(100% - 32px));display:flex;gap:12px;align-items:center}
.toast.err{background:var(--danger)}
.skel{background:linear-gradient(90deg,#eeeaf3,#f7f5fa,#eeeaf3);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px;height:14px}
@keyframes sh{to{background-position:-200% 0}}
.center-card{max-width:480px;margin:8vh auto;padding:32px;text-align:center}
.center-card .mark{width:56px;height:56px;font-size:32px;border-radius:14px;margin:0 auto 14px;background:var(--piper);color:#fff}
.spinner{width:28px;height:28px;border:3px solid var(--piper-100);border-top-color:var(--piper);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- public form */
.join-hero{background:var(--piper);color:#fff;padding:36px 20px 76px}
.join-hero-in{max-width:760px;margin:0 auto}
.join-hero .brand{margin-bottom:22px}
.join-hero h1{font-size:34px;margin:0 0 10px;letter-spacing:-.02em;line-height:1.1}
.join-hero p{font-size:17px;opacity:.92;margin:0;max-width:640px}
.join-wrap{max-width:760px;margin:-52px auto 40px;padding:0 16px}
.join-card{padding:26px}
.join-card fieldset{border:0;padding:0;margin:0 0 26px}
.join-card legend{font-size:18px;font-weight:700;color:var(--piper-900);margin-bottom:4px;padding:0}
.join-card .hint{color:var(--muted);margin:0 0 14px;font-size:14px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:10px;border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;cursor:pointer;align-items:flex-start;background:#fff}
.opt:hover{border-color:var(--piper-300)}
.opt:has(input:checked){border-color:var(--piper);background:var(--piper-50);box-shadow:inset 0 0 0 1px var(--piper)}
.opt input{width:18px;height:18px;accent-color:var(--piper);margin-top:2px;flex:none}
.opt b{display:block;font-size:15px}
.opt span{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.join-foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}

/* ---------- print flyer */
.flyer{display:none}
@media print{
  body.printing>*:not(.flyer){display:none!important}
  body.printing .flyer{display:block;text-align:center;padding:40px;font-family:var(--font)}
  .flyer h1{font-size:40px;color:#543484;margin:0 0 10px}
  .flyer .qrbig{width:360px;height:360px;margin:30px auto}
  .flyer .qrbig svg{width:100%;height:100%}
}

/* ---------- responsive */
@media (max-width:1000px){
  .dir{grid-template-columns:1fr}
  .filters{position:static;max-height:none;display:none}
  .filters.open{display:block}
  .filters-toggle{display:inline-flex}
  .sub-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand div span{display:none}
  .nav{order:3;flex-basis:100%;margin:0 -6px}
  .nav a{padding:7px 10px;font-size:13.5px}
  .role-tag{display:none}
  .live span{display:none}
  main{padding:14px 16px}
  .page-head h1{font-size:21px}
  .bulkbar{top:104px}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{position:relative;padding:12px 12px 12px 46px;border-bottom:1px solid var(--line)}
  .tbl td{border:0;padding:2px 0}
  .tbl td.blank{display:none}
  .tbl td.cb{position:absolute;left:12px;top:12px;width:auto}
  .tbl td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:12px}
  .tbl.plain tr{padding-left:12px}
  .cell-tags{max-width:none}
  .grid2,.grid3,.opt-grid{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr;gap:2px}

  if (f.staff) out.push(['staff', '', 'Staff: ' + f.staff]);
  if (f.last) out.push(['last', '', { recent: 'Contacted recently', stale: 'Not contacted in ' + staleMonths() + '+ months', never: 'Never contacted' }[f.last]]);
  if (f.status !== 'Active') out.push(['status', '', f.status === 'All' ? 'All statuses' : f.status]);
  if (f.missing) out.push(['missing', '', 'Missing: ' + f.missing]);
  if (!out.length) return '';
  return html`<div class="active-filters">${out.map(function (o) { return html`<button class="chip" data-act="rm-filter" data-g="${o[0]}" data-v="${o[1]}" aria-label="Remove filter ${o[2]}">${o[2]} ${I('x')}</button>`; })}
    <button class="btn sm ghost" data-act="clear-filters">Clear all</button></div>`;
}
function bulkBar() {

/* ================================================================ activity */
function viewActivity() {

  var years = uniq(all.map(function (e) { return schoolYear(e.date); })).sort().reverse();
  var list = all.filter(function (e) {
    if (a.year && schoolYear(e.date) !== a.year) return false;
    if (a.activity && e.activity !== a.activity) return false;
    if (a.academy && e.academy !== a.academy) return false;
    if (a.staff && e.staff !== a.staff) return false;
    var c = IX.byId.get(e.contactId), hay = norm([e.contactName, e.activity, e.notes, e.staff, c ? c.company : ''].join(' '));
    return toks.every(function (t) { return hay.indexOf(t) >= 0; });
  });
  var people = uniq(list.map(function (e) { return e.contactId; })).length;
  var byAct = {}; list.forEach(function (e) { byAct[e.activity] = (byAct[e.activity] || 0) + 1; });
  var acts = Object.keys(byAct).sort(function (x, y) { return byAct[y] - byAct[x]; });
  var max = acts.length ? byAct[acts[0]] : 1;
  var actOpts = uniq(L().roles.map(function (r) { return r.name; }).concat(all.map(function (e) { return e.activity; })));
  var staffOpts = uniq(all.map(function (e) { return e.staff; })).sort();

    <div class="card stat" style="grid-column:span 2;min-width:0"><div class="bars">${acts.slice(0, 5).map(function (k) {
      return html`<div class="bar-row"><span class="nowrap" style="overflow:hidden;text-overflow:ellipsis">${k}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(4, Math.round(byAct[k] / max * 100))}%"></div></div><b class="small">${byAct[k]}</b></div>`;
    })}${acts.length ? '' : html`<span class="muted small">Nothing logged for this view yet.</span>`}</div></div>
  </div>
  <div class="toolbar">
    <label class="search">${I('search')}<span class="sr">Search participation</span><input id="act-q" class="input" type="search" placeholder="Search partner, notes…" value="${a.q}" data-in="act.q"></label>
    <div>${selectHtml('act-year', 'act.year', [['', 'All school years']].concat(years.map(function (y) { return [y, y]; })), a.year, 'School year')}</div>
    <div>${selectHtml('act-activity', 'act.activity', [['', 'All activities']].concat(actOpts.map(function (x) { return [x, x]; })), a.activity, 'Activity')}</div>
    <div>${selectHtml('act-academy', 'act.academy', [['', 'All academies']].concat(L().academies.map(function (x) { return [x.name, x.name]; })), a.academy, 'Academy')}</div>

/* ================================================================ data health */
function viewHealth() {
  var cs = S.d.contacts.filter(function (c) { return c.status !== 'Inactive'; });
  var stale = staleMonths();
  var pairs = duplicatePairs();
  var n = function (fn) { return cs.filter(fn).length; };
  var items = [
    ['name', 'No name', n(function (c) { return !c.first && !c.last; }), 'Only an email address. Add a name so people can find them.'],
    ['reach', 'No email or phone', n(function (c) { return !c.email && !c.phone; }), 'No way to reach them.'],
    ['role', 'No role yet', n(function (c) { return !c.roles.length; }), 'Tag what they can help with so they show up in role filters.'],
    ['academy', 'No academy yet', n(function (c) { return !c.academies.length; }), 'Tag academies so each academy can find their people.'],
    ['stale', 'Not contacted in ' + stale + '+ months', n(function (c) { return c.lastContact && monthsSince(c.lastContact) >= stale; }), 'Good people to re-engage.'],
    ['never', 'No contact date recorded', n(function (c) { return !c.lastContact; }), 'Log participation to fill this in automatically.']

function modalHtml() {

function submitJoin(form) {
  var g = function (n) { return String((form.elements[n] && form.elements[n].value) || '').trim(); };
  var all = function (n) { return Array.prototype.map.call(form.querySelectorAll('input[name="' + n + '"]:checked'), function (i) { return i.value; }); };
  var p = {
    title: g('title'), first: g('first'), last: g('last'), email: g('email'), phone: g('phone'), profession: g('profession'),
    company: g('company'), location: g('location'), linkedin: g('linkedin'), roles: all('roles'), academies: all('academies'),
    availability: (form.querySelector('input[name="availability"]:checked') || {}).value || '', relationship: g('relationship'),
    staffKnown: g('staffKnown'), message: g('message'), consent: form.elements.consent.checked, website: g('website'),
    elapsedMs: Date.now() - PUB.start
  };
  var errs = [];
  if (!p.first) errs.push(['first', 'your first name']);
  if (!p.last) errs.push(['last', 'your last name']);
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email)) errs.push(['email', 'a valid email']);
  if (!p.profession) errs.push(['profession', 'your job title or profession']);
  if (!p.consent) errs.push(['consent', 'the permission checkbox']);
  var box = form.querySelector('.form-err');
  Array.prototype.forEach.call(form.querySelectorAll('[aria-invalid]'), function (el) { el.removeAttribute('aria-invalid'); });
  if (errs.length) {
    errs.forEach(function (e) { form.elements[e[0]].setAttribute('aria-invalid', 'true'); });
    put(box, html`<div class="errbox" role="alert">Please add ${errs.map(function (e) { return e[1]; }).join(', ')}.</div>`);
    form.elements[errs[0][0]].focus();
    return;
  }
  var btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Sending…';
  Backend.call('submitPartner', p).then(function () { PUB.done = p.first; renderJoinForm(); window.scrollTo(0, 0); },
    function (e) { btn.disabled = false; btn.textContent = 'Send my information'; put(box, html`<div class="errbox" role="alert">${e.message}</div>`); });
}

/* ================================================================ errors & saving */
function handleErr(e, form) {
  if (e && (e.code === 'AUTH')) {
    if (MODE === 'web') { Auth.clear(); S.d = null; closeModal(); return renderSignIn('Your sign-in expired. Please sign in again.'); }
  }
  var box = form && form.querySelector('.form-err');
  if (box) {
    put(box, html`<div class="errbox" role="alert">${e.message}${e.code === 'CONFLICT' && e.data ? html` <button type="button" class="btn sm" data-act="conflict-load">Load their version</button>` : ''}</div>`);
    if (e.code === 'CONFLICT') S.conflict = e.data;
    box.scrollIntoView({ block: 'nearest' });
  } else toast(e.message || String(e), { err: true });
}
function saving(form, fn) {
  var btn = form && form.querySelector('[type=submit]'), label = btn && btn.innerHTML;
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  S.saving = true;
  return Promise.resolve().then(fn).catch(function (e) { handleErr(e, form); }).then(function () {
    S.saving = false;
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = label; }
  });
}
function confirmThen(opts) { openModal(Object.assign({ type: 'confirm' }, opts)); }
function afterChange() { reindex(); render(); renderLayer(); }

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (S.menu && !e.target.closest('.menu') && !(el && el.dataset.act === 'menu')) { S.menu = false; render(); }
  if (!el) return;
  var fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' && el.dataset.act === 'close-modal') { closeModal(); return; } // let the link navigate
  if (el.tagName !== 'INPUT') e.preventDefault();
  fn(el, e);
});

/* ================================================================ inputs */
var renderSoon = debounce(function () { render(); }, 140);
function setPath(path, v) { var p = path.split('.'); S[p[0]][p[1]] = v; }
function onInput(e) {
  var el = e.target, key = el.dataset && el.dataset.in;
  if (!key) return;
  if (key === 'dupe') {
    var form = el.form, c = readContactForm(form);
    put(document.getElementById('dupe-box'), dupeBox(c, S.modal && S.modal.id));
    return;
  }
  if (key === 'log-add') {
    var id = idFromLabel(el.value);
    if (id && IX.byId.has(id)) { if (S.modal.ids.indexOf(id) < 0) S.modal.ids.push(id); el.value = ''; refreshLogWho(); }
    return;
  }
  if (key === 'log-activity') { document.getElementById('log-other-wrap').classList.toggle('hide', el.value !== '__other'); return; }
  if (key === 'px-contact') {
    var c2 = IX.byId.get(idFromLabel(el.value)); if (!c2) return;
    var f = el.form;
    if (!f.elements.partnerName.value) f.elements.partnerName.value = fullName(c2);
    if (!f.elements.email.value) f.elements.email.value = c2.email;
    if (!f.elements.phone.value) f.elements.phone.value = c2.phone;
    if (!f.elements.company.value) f.elements.company.value = c2.company;
    return;
  }
  if (key.indexOf('.') > 0) {
    setPath(key, el.value); S.limit = 150;
    if (el.tagName === 'SELECT') render(); else renderSoon();
  }
}
document.addEventListener('input', function (e) { if (e.target.tagName !== 'SELECT') onInput(e); });
document.addEventListener('change', function (e) { if (e.target.tagName === 'SELECT' || e.target.dataset.in === 'log-add' || e.target.dataset.in === 'px-contact') onInput(e); });

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (S.modal) { closeModal(); e.preventDefault(); }
    else if (S.drawer) { ACT['close-drawer'](); e.preventDefault(); }
    else if (S.menu) { S.menu = false; render(); }
  }
  if (e.key === '/' && !S.modal && S.d && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    var q = document.getElementById(S.view === 'activity' ? 'act-q' : S.view === 'partnerships' ? 'px-q' : 'q');
    if (q) { e.preventDefault(); q.focus(); }
  }
});

/* ================================================================ form submits */
var FORMS = {
  contact: function (form) {
    var m = S.modal, c = readContactForm(form);
    if (!c.first && !c.last && !c.email && !c.company) return handleErr(new Error('Add at least a name, email, or company.'), form);
    if (c.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)) return handleErr(new Error('That email address does not look right.'), form);
    return saving(form, function () {
      if (m.sub) {
        return Backend.call('reviewSubmission', { id: m.sub, decision: 'approve', contact: c }).then(function (r) {
          upsert(S.d.submissions, r.submission); upsert(S.d.contacts, r.contact);
          S.modal = null; afterChange(); toast('Added ' + displayName(r.contact) + ' to the directory');
        });
      }
      var cur = m.id ? IX.byId.get(m.id) : null, payload = { contact: c };
      if (m.snap) {
        // Send only what this person changed, plus what it looked like when they opened it,
        // so edits made at the same time in the sheet (or by another admin) are never overwritten.
        var changes = { id: m.snap.id }, original = {}, n = 0;
        Object.keys(c).forEach(function (k) { if (!sameVal(c[k], m.snap[k])) { changes[k] = c[k]; original[k] = m.snap[k] == null ? '' : m.snap[k]; n++; } });
        if (!n) { S.modal = null; renderLayer(); toast('No changes'); return; }
        payload = { contact: changes, original: original };
      } else if (cur) c.id = cur.id;
      return Backend.call('saveContact', payload).then(function (r) {
        upsert(S.d.contacts, r.contact);
        S.modal = null; S.drawer = r.contact.id; history.replaceState(null, '', '#c/' + r.contact.id);
        afterChange(); toast(r.unchanged ? 'No changes' : cur ? 'Saved' : 'Added ' + displayName(r.contact));
      });
    });
  },
  log: function (form) {
    var m = S.modal, g = function (n) { return String(form.elements[n].value || '').trim(); };
    var activity = g('activity') === '__other' ? g('activityOther') : g('activity');
    if (!m.ids.length) return handleErr(new Error('Add at least one person.'), form);
    if (!activity) return handleErr(new Error('Describe what they did.'), form);
    var entries = m.ids.map(function (id) { return { contactId: id, date: g('date'), activity: activity, academy: g('academy'), staff: g('staff'), notes: g('notes') }; });
    return saving(form, function () {
      return Backend.call('logEngagements', { entries: entries }).then(function (r) {
        S.d.engagements = S.d.engagements.concat(r.engagements);
        r.contacts.forEach(function (c) { upsert(S.d.contacts, c); });
        S.modal = null; S.sel.clear(); afterChange(); toast('Logged ' + plural(r.engagements.length, 'record'));
      });
    });
  },
  bulk: function (form) {
    var all = function (n) { return Array.prototype.map.call(form.querySelectorAll('input[name="' + n + '"]:checked'), function (i) { return i.value; }); };
    var ch = { addRoles: all('addRoles'), removeRoles: all('removeRoles'), addAcademies: all('addAcademies'), removeAcademies: all('removeAcademies'),
      addStaff: all('addStaff'), status: form.elements.status.value, relationship: form.elements.relationship.value };
    return saving(form, function () {
      return Backend.call('bulkUpdateContacts', { ids: Array.from(S.sel), changes: ch }).then(function (r) {
        r.contacts.forEach(function (c) { upsert(S.d.contacts, c); });
        S.modal = null; afterChange(); toast('Updated ' + plural(r.contacts.length, 'person', 'people'));
      });
    });
  },
  merge: function (form) {
    var m = S.modal, keep = form.querySelector('input[name=keep]:checked').value, drop = keep === m.a ? m.b : m.a;
    return saving(form, function () {
      return Backend.call('mergeContacts', { keepId: keep, removeId: drop }).then(function (r) {
        S.d.contacts = S.d.contacts.filter(function (c) { return c.id !== r.removedId; });
        upsert(S.d.contacts, r.contact);
        ['engagements', 'partnerships', 'submissions'].forEach(function (t) { S.d[t].forEach(function (x) { if (x.contactId === r.removedId) x.contactId = r.contact.id; }); });
        S.modal = null; afterChange(); toast('Merged into ' + displayName(r.contact));
      });
    });
  },
  'pend-merge': function (form) {
    var m = S.modal;
    return saving(form, function () {
      return Backend.call('reviewSubmission', { id: m.sid, decision: 'merge', contactId: m.cid, preferNew: form.elements.preferNew.checked }).then(function (r) {
        upsert(S.d.submissions, r.submission); upsert(S.d.contacts, r.contact);
        S.modal = null; afterChange(); toast('Merged into ' + displayName(r.contact));
      });
    });
  },
  px: function (form) {
    var g = function (n) { return String(form.elements[n].value || '').trim(); };
    var x = { id: S.modal.id || '', company: g('company'), type: g('type'), contactId: idFromLabel(g('contact')), partnerName: g('partnerName'),
      email: g('email'), phone: g('phone'), academy: g('academy'), schoolYear: g('schoolYear'), status: g('status'), notes: g('notes') };
    if (!x.company) return handleErr(new Error('Company is required.'), form);
    if (g('contact') && !x.contactId) return handleErr(new Error('Pick the person from the list, or clear that box.'), form);
    return saving(form, function () {
      return Backend.call('savePartnership', { partnership: x }).then(function (r) {
        upsert(S.d.partnerships, r.partnership); S.modal = null; afterChange(); toast('Saved ' + r.partnership.company);
      });
    });
  },
  settings: function (form) {
    var roles = [], acads = [], renames = { roles: {}, academies: {} };
    Array.prototype.forEach.call(form.querySelectorAll('#set-roles tr'), function (tr) {
      var name = tr.querySelector('[name=role-name]').value.trim(); if (!name) return;
      roles.push({ name: name, description: tr.querySelector('[name=role-desc]').value.trim(), showOnForm: tr.querySelector('[name=role-show]').checked });
      var o = tr.dataset.orig; if (o && o !== name) renames.roles[o] = name;
    });
    Array.prototype.forEach.call(form.querySelectorAll('#set-acads tr'), function (tr) {
      var name = tr.querySelector('[name=acad-name]').value.trim(); if (!name) return;
      acads.push({ name: name, description: tr.querySelector('[name=acad-desc]').value.trim() });
      var o = tr.dataset.orig; if (o && o !== name) renames.academies[o] = name;
    });
    var lines = function (n) { return uniq(form.elements[n].value.split(/\n+/).map(function (x) { return x.trim(); })); };
    var cfg = {};
    Array.prototype.forEach.call(form.querySelectorAll('[name^="cfg:"]'), function (el) { cfg[el.name.slice(4)] = el.value.trim(); });
    if (!roles.length || !acads.length) return toast('Keep at least one role and one academy.', { err: true });
    var btn = form.querySelector('[type=submit]'); btn.disabled = true;
    Backend.call('saveSettings', { roles: roles, academies: acads, relationships: lines('relationships'), staff: lines('staff'), admins: lines('admins'), config: cfg, renames: renames })
      .then(function (r) {
        S.d.settings = r.settings;
        if (MODE === 'demo' || r.renamedContacts) return Backend.call('bootstrap').then(applyBootstrap);
      })
      .then(function () { reindex(); render(); toast('Settings saved'); }, function (e) { btn.disabled = false; handleErr(e); });
  },
  join: function (form) { submitJoin(form); }
};
document.addEventListener('submit', function (e) {
  var f = e.target, fn = f.dataset && FORMS[f.dataset.form];
  if (!fn) return;
  e.preventDefault(); fn(f);
});

/* ================================================================ boot */
function route() {
  var h = location.hash.replace(/^#/, ''), m = /^c\/([A-Za-z0-9]+)/.exec(h);
  if (m) { S.drawer = m[1]; if (VIEWS.indexOf(S.view) < 0) S.view = 'directory'; }
  else { S.view = VIEWS.indexOf(h) >= 0 ? h : 'directory'; S.drawer = null; }
  S.menu = false;
  document.title = { directory: 'Directory', activity: 'Participation', partnerships: 'Partnerships', pending: 'Pending', health: 'Data health', config: 'Settings', share: 'Partner form' }[S.view] + ' · Piper Industry Partners';
}
window.addEventListener('hashchange', function () {
  if (location.hash === '#join' && !PUB.cfg) { S.drawer = null; S.modal = null; renderLayer(); return loadJoin(); }
  if (PUB.cfg && location.hash !== '#join') { PUB.cfg = null; PUB.done = null; return startStaff(); }
  if (!S.d || PUB.cfg) return;
  var wasView = S.view; route();
  if (S.modal) S.modal = null;
  render(); renderLayer();
  if (wasView !== S.view) window.scrollTo(0, 0);
});
function applyBootstrap(d) {
  if (MODE !== 'demo') store.set(CACHE_KEY, { d: d, at: Date.now(), who: d.me.email });
  S.d = d; S.loadedAt = Date.now(); Live.have = d.dataVersion || Live.have; reindex();
}
function reload(silent) {
  S.refreshing = true; if (!silent) render();
  return Backend.call('bootstrap').then(function (d) { applyBootstrap(d); if (!silent) toast('Up to date'); },
    function (e) { handleErr(e); })
    .then(function () { S.refreshing = false; if (S.d) { render(); if (!S.modal) renderLayer(); } });
}
function snapContact(id) { var c = IX.byId.get(id); if (!c) return null; var o = {}; Object.keys(c).forEach(function (k) { if (k.charAt(0) !== '_') o[k] = clone(c[k]); }); return o; }
function sameVal(a, b) {
  var n = function (v) { return Array.isArray(v) ? v.map(String).sort().join('\u0001') : String(v == null ? '' : v).trim(); };
  return n(a) === n(b);
}

/* ================================================================ live updates
   Every few seconds the app asks Google one tiny question: "has anything changed?"
   If yes (someone edited the sheet, or another staff member saved), it quietly reloads. */
var Live = {
  have: null, timer: null, busy: false, ok: true, started: false, lastActivity: Date.now(), noticed: false,
  start: function () { if (MODE === 'demo' || this.started) return; this.started = true; this.schedule(2500); },
  every: function () { return Date.now() - this.lastActivity > 10 * 60e3 ? 30000 : 5000; },
  schedule: function (ms) { var self = this; clearTimeout(this.timer); this.timer = setTimeout(function () { self.tick(); }, ms); },
  tick: function () {
    var self = this;
    if (document.visibilityState !== 'visible' || !S.d || PUB.cfg) return self.schedule(self.every());
    if (self.busy || S.saving) return self.schedule(1500);
    self.busy = true;
    Backend.call('version').then(function (d) {
      self.ok = true;
      if (self.have && d.v !== self.have) return silentRefresh();
      if (!self.have) self.have = d.v;
    }, function () { self.ok = false; })
      .then(function () { self.busy = false; liveDot(); self.schedule(self.every()); });
  }
};
function liveDot(flash) {
  var el = document.getElementById('live'); if (!el) return;
  el.classList.toggle('off', !Live.ok);
  el.lastElementChild.textContent = Live.ok ? 'Live' : 'Reconnecting';
  el.title = Live.ok ? 'Live: changes from the sheet and other staff show up within seconds' : 'Can’t reach the sheet right now. Retrying…';
  if (flash) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
function silentRefresh() {
  return Backend.call('bootstrap').then(function (d) {
    if (S.saving) return;                         // a save is in flight; the next check catches up
    var settingsOpen = S.view === 'config';
    applyBootstrap(d);
    if (settingsOpen) {                           // never wipe someone's half-edited settings form
      if (!Live.noticed) { Live.noticed = true; toast('Someone else changed data. Your settings form was left as is.'); }
      return;
    }
    paintSoon();
  });
}
/** Repaint after new data arrives, but never in the middle of a click or keystroke. */
function paintSoon() {
  var wait = Live.lastPress + 1200 - Date.now();
  if (wait > 0) return setTimeout(paintSoon, wait);
  if (S.saving) return setTimeout(paintSoon, 800);
  render(); if (!S.modal) renderLayer();
  liveDot(true);
}
Live.lastPress = 0;
['click', 'keydown', 'mousemove', 'touchstart', 'scroll'].forEach(function (ev) {
  document.addEventListener(ev, function () { Live.lastActivity = Date.now(); }, { passive: true });
});
['pointerdown', 'keydown'].forEach(function (ev) {
  document.addEventListener(ev, function () { Live.lastPress = Date.now(); }, { passive: true, capture: true });
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { Live.lastActivity = Date.now(); if (Live.started) Live.schedule(300); }
});
function startStaff() {
  if (MODE === 'setup') return renderSetup();
  if (MODE === 'web') { Auth.capture(); if (!Auth.token()) return renderSignIn(); }
  var cached = MODE !== 'demo' ? store.get(CACHE_KEY) : null;
  var who = MODE === 'web' ? Auth.who() : null;
  if (cached && cached.d && (!who || cached.who === who)) {
    S.d = cached.d; reindex(); route(); S.refreshing = true; render(); renderLayer();
  } else renderLoading();
  Backend.call('bootstrap').then(function (d) {
    applyBootstrap(d); S.refreshing = false; route(); render(); renderLayer(); Live.start();
  }, function (e) {
    S.refreshing = false;
    if (e.code === 'AUTH' || e.code === 'FORBIDDEN') {
      if (MODE === 'web') { Auth.clear(); S.d = null; return renderSignIn(e.message); }
      S.d = null; return centerCard(html`<h1 style="font-size:22px">Piper staff only</h1><div class="errbox" style="text-align:left">${e.message}</div>
        <p class="small muted">Partners: please use the partner form link you were sent.</p>`);
    }
    if (S.d) { render(); toast('Could not refresh: ' + e.message, { err: true }); } else renderError(e);
  });
}
function start() {
  if (MODE === 'gas') {
    google.script.url.getLocation(function (loc) {
      var p = (loc && loc.parameter) || {};
      if (p.page === 'join') loadJoin(); else startStaff();
    });
    return;
  }
  loadConfig(function () { if (QS.get('page') === 'join' || location.hash === '#join') loadJoin(); else startStaff(); });
}
start();
window.__piper = { S: S, MODE: MODE, Backend: Backend };
})();

</script>
